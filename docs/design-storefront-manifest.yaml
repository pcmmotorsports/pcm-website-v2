# PCM 設計 ↔ 現場 對照清單 v1.0
#
# 用途:Cowork / Code 動 storefront 元件前 Read 此檔、知道對應 design 字面源 + 業務拍板偏離 + 同步狀態
# 維護:Cowork 寫第一版、後續 slice 結束更新對應元件 last_modified_commit / date 段
#       新元件 / 新業務 override 在對應 slice 寫前更新
#       重大改動跑 PRD-reviewer 級 audit(對齊 docs/patterns/cowork-review-chain.md §1)
#
# 排除規則:
#   - design-reference/components/explorations/ 整個目錄 exclude(設計探索用、storefront 不對齊)
#   - design-reference/styles/*.v1.css 標 deprecated_in_design: true(舊版本、storefront 不需對齊)
#
# 衝突仲裁:本 manifest > storefront 既有 code、但 business_overrides 段內偏離合法、不誤判
#   🔴 **兩個 override 抽屜,不要混**(2026-08-05 新增,D5e-1 R3 F4):
#     · `business_overrides` = **外部權威**授權的偏離(Sean 拍板／plan 批准／對抗審查 verdict／稽核)。
#       上面那句「段內偏離合法、不誤判」只適用這一段。
#     · `technical_overrides` = **施工端自己的技術判斷**(未經拍板)。看到它就知道可以質疑。
#       施工端不得把自己的判斷塞進 business_overrides —— 那等於就地自我合法化,
#       而審查者被上面那句指示「不要誤判」。首例 = FeatureEditorial 的
#       focusRotationUsesTaipeiCalendarDay。✅ **Sean 2026-08-05 拍 B 追認分家**(信箱 C-98-A)。
#   🔴 **新段的仲裁語句(不要讓它長出 business 段那種自我合法化語意)**:
#     technical_overrides 的授權來源 = **施工端判斷**。審查者應**逐條檢視理由是否成立**,
#     **不得因其在此段而免審**。上面「段內偏離合法、不誤判」那句**只涵蓋 business_overrides**。
#
# 字面 vs 事實:
#   - last_modified_commit 寫【案 A 記可達祖先】= 前一個已落地 HEAD 可達 commit(通常 = 本 slice 父 commit)、
#     不寫 PENDING_HASH、不 commit 後 amend(amend 自身 hash 數學不可能 → orphan;固化見 #180 +
#     docs/patterns/slice-checkpoint.md「last_modified_commit 寫法」段)。可達性由
#     `node scripts/design-mirror.mjs --validate` 機械 gate(git merge-base --is-ancestor)。
#   - design_value 段引用 design-reference 字面、不憑記憶(對齊 working-style 第 11 條)

