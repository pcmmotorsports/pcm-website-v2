        backlog: "—(無獨立條目;本片內解決。⚠️ 白字對熔橘 3.12:1 是 **Sean 2026-08-05 看過三個替代方案後拍板保留**的殘餘風險,見 handoff §十一 + C-104-A 六不做 ⑤ —— **不得順手修正**,守門在 `home.test.ts` 釘住白字與三顆色值)"
