        reason: "🔴 **守門本身差點是假的**:開發機實測 `Intl.DateTimeFormat().resolvedOptions().timeZone === 'Asia/Taipei'` ⇒ 在這台機器上把實作裡的 `timeZone` 選項整個拿掉,時區斷言**照樣全綠** —— 也就是「會出事的環境(UTC server)」正好是「測不到的環境」。修法:`brand-focus.test.ts` 開頭 `process.env.TZ = 'UTC'` **並附前提斷言驗證它真的釘上了**(沒釘上就大聲紅,不讓整組斷言默默退化成恆真);釘 UTC 後拿掉 `timeZone` 的突變實測轉紅。屬 memory `feedback_fixture-value-makes-guard-vacuous` 那一族。"

