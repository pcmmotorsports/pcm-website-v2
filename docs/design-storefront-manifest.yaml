      last_modified_date: "2026-08-07 [Q8=A 接線片:收缺口①「清除」鈕;共用 `VehicleCombo` 的新 `onDraftTextChange` 契約與 lint 抑制申報見 VehicleFinder 條目同日段落]:①「清除」的可按條件由 `hasDraft`(只看已選定值)改成 `hasDraft || hasTypedText`,後者來自三顆 `VehicleCombo` 回報的內部草稿字(新 `draftText` state)。②按下清除時**三件一起**:`setDraft(EMPTY_DRAFT)` + `setDraftText(EMPTY_TEXT)` + `setComboSeq(s => s + 1)`,最後那顆是 React 官方 key-reset —— 三個 `.mvs-field` 整批包進 `<Fragment key={comboSeq}>` remount。🔴 **為什麼非 remount 不可**:光清父層 state 清不掉子元件內部的 `text`,而沒選中那欄的 `value` 是 `null → null`、`useEffect(..., [value])` 那道丟草稿的守門 deps 沒變、蓋不到 —— 這正是原缺口第二個症狀(按了「清除」、字還在、鈕又變灰、再也按不掉)的機制本身。`Fragment` 不產生 DOM 節點 ⇒ `.mvs-field` 結構與 `products-mobile.css` 的 `.mvs-*` 選擇器族**零影響**;清除鈕本身**留在 Fragment 外**、不被 remount。⚠️ **本欄初版寫「按完焦點仍留在鈕上」是錯的理由**(R3 更正):iOS/macOS Safari 點 `<button>` 根本不給焦點,而客人剛在打字 ⇒ tap 當下 input 先 blur、`activeElement` 落在 body。結論(remount 沒讓焦點更糟)仍成立,但**別再引用那個理由**。真瀏覽器未量。③`applyDraft` / `canApply` / `GarageChips` / 三欄可見字面與 placeholder **逐字不動**。測試:兩條原本「釘缺口」的測試依其就地註記**改斷言方向**(檔內原話「修好時請改斷言方向、別把期望值改回去」),另補一條「背景有車、草稿清空後只打字 → 再按清除 → 欄位清空**且全程 `dispatch` 零呼叫**」。🔴 **這條的第一版是假綠、由 R1 對抗審查抓出**:原版直接用 `cascade.vehicle={Ducati,Monster}` 就打字,但 `useState(() => draftFromVehicle(cascade.vehicle))` 這個 initializer 會**把已套用的車當草稿起點** ⇒ 掛載當下廠牌欄就已是選定的 `Ducati`、blur 走 Q7=A 還原,「三欄皆未選定」的前提**雙重不成立**,整條退化成既有那條「清除只清草稿」的重複、M2/M3 兩個突變下都仍是綠的。改法=**先按一次清除**把草稿歸零才構造得出那一格;改寫後 M2、M3 各自都能把它弄紅=判別力成立。教訓同族:fixture 的初值會讓整條守門恆真。⚠️ 本條也是「負測構造不出來時先懷疑前提」的反例——它構造得出來,只是構造的**起點**被 initializer 悄悄墊高了。前:2026-08-07 [blur 邊角片:Sean Q6=A / Q7=A(接前一片 Q4=B);共用 `VehicleCombo`、行為改動記於 business_overrides.blurDraftRetentionAndEmptyHint]:①Q7=A 已選定的欄位 blur 仍還原(守門畫在不變量面:`value` 從外部變動就丟過期草稿,審查實測「打 kawa → 跨層選 Kawasaki Z900」原本會顯示 kawa 而已選 Kawasaki)②Q6=A 零命中提示補齊——四句文案原本逐檔硬編在 **4 個檔**(VehicleSelect / CascadeFilterTop / MobileVehicleSheet / FilterDrawerVehicleTab),收成單一常數 `VEHICLE_EMPTY_HINTS`、11 個選車欄位全數傳入(字面 byte 未改,合併前後逐檔比對過)。359 檔零變;5485→5493(Δ=+8 全為新守門)。審查 R1 FAIL 6 條 / R2 FAIL 1 條,已折;兩個已知缺口未修、見本條 backlog。前:2026-08-07 [愛車圖示換重機 Q2=A;related 檔 GarageChips.tsx(variant=sheet)連動、零版面零行為變更]:面板頂「我的愛車」鈕圖示由汽車換重機,詳見 ProductsPage 條目同日段落與 AccountPages 的 business_override `vehiclesIconIsMotorcycle`。前:2026-08-05 [A-engine 選車引擎統一 B′ · A5 + A9 CSS 密度分家;本條目為 R2 補登記——本元件自 ADR-0007 建立起就沒有 manifest 條目,而 A5 動到它才發現(manifest 規範:觸到就建條目)]:①A5 aria label 由裸名詞改成「選擇廠牌/車型/年份」(A 表:aria 統一「選擇 X」)、廠牌欄 emptyHint 的「品牌」殘留改「廠牌」;可見欄標(廠牌 / 車型 · 可不選)、placeholder、跨層直搜、無年份出口**逐字不動** —— 本元件就是 A 表的原型,全站規範照它寫。②A9 連動:`.cat-garage-heading` 原本是**無 scope 的全域規則**、內容其實是本面板的卡片密度(17px/850 + space-between + margin-bottom),當時全站只有 sheet 會渲染它所以看不出來;副註推廣到四個掛載點後改成基礎=行內密度、卡片密度收進 `.cat-garage--sheet` 底下(設計稿 §B 兩種密度)。本面板視覺**零變化**,守門在 `styles/products-mobile.test.ts` 新增的兩條。🔴 :170 那顆「清除」= 只清草稿(spec §4-2),不得被「清除車輛」的統一文案吃掉。"
