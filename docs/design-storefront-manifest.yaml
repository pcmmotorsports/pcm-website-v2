        backlog: "🟡 **缺口①已收、缺口②只收一半(2026-08-07 Q8=A 接線片,Sean 拍板 A)**。🔴 **②的準確狀態(R3 對抗審查更正初版的「✅ 兩個缺口已收」= 過度宣稱)**:`InlineVehicleForm`「改用自行輸入」帶走草稿字這件事,**只在自由輸入欄目前是空的時候才發生**(守門 `name.trim() === ''`,R2 抓到不加它會蓋掉客人手打的車名)。⇒ **每一條編輯既有愛車的路徑**(`veh.name` 恆非空)、以及任何曾在自由欄打過字的新增路徑,缺口② **等於沒收**、草稿照舊無聲消失。另有一條**已申報的不對稱**:廠牌+車型**都選齊**時仍無條件以 `vehicleLabel` 覆蓋 `name`(含覆蓋客人手打的自由文字)—— 那是 HEAD 既有行為、V-1d「客人可改顯示名」的刻意設計,本片原樣保留。兩者都用測試釘住現況並就地註明「非規格、要改先問 Sean」。**🔴 **Sean 2026-08-07 傍晚拍板 Q10=A(維持現況)⇒ 上述兩條不再是「待決的現況」,而是規格**:絕不覆蓋客人已打好的車名;編輯既有愛車時清單那邊的草稿刻意不帶入;選齊時仍以 `vehicleLabel` 覆蓋(V-1d)。兩條測試的「非規格、要改先問 Sean」註記已同步轉正。⚠️ **Q10=A 不等於同根因的債③④⑤⑥消失** —— 那四條是「靜默丟/殘留」問題、與這裡的「誰蓋誰」覆蓋規則**正交**,補片照舊=6 掛載面全掃(Sean 同批拍板,排佇列第 4)。** 原記載逐字保留備查:「已知缺口(未修、已用測試釘住現況並註明非規格):草稿是 `Combo` 的內部 state,父層看不到 ⇒ ①`MobileVehicleSheet` 的「清除」鈕只看已套用值 —— 欄位有字時鈕停用、而按得動時又清不掉沒選中那欄的草稿;②`InlineVehicleForm`「改用自行輸入」會讓草稿無聲消失。兩者同根因,修法要動共用 `VehicleCombo` 介面(4 個消費端),已提 D-274-STOP 交主視窗裁」。收法:`VehicleCombo` 新增 optional `onDraftTextChange`(不傳=行為零變動)⇒ ①`MobileVehicleSheet` 清除的可按條件改 `hasDraft || hasTypedText`,按下時另用 React key-reset 整批 remount 三顆欄位(光清父層 state 清不掉子元件內部草稿);②`InlineVehicleForm`「改用自行輸入」未選齊時帶「看得見什麼就帶什麼」的組合字面過去。兩條原本釘缺口的測試已依其就地註記**改斷言方向**(非把期望值改回去)。詳見 VehicleFinder / MobileVehicleSheet 兩條目的 `last_modified_date` 同日 [Q8=A 接線片] 段落。🔴 **同根因(草稿是 `Combo` 內部 state、父層看不見)還有 **4** 個症狀未收,Sean 未拍板故不在本片範圍,未修。⚠️ 本欄一度只列 ③④ = **枚舉邊界畫錯**(R4 跨模型輪抓出):前四輪 Opus 全部在「`VehicleCombo` 的兩個接線端」這個框裡數債,沒有人拿根因去掃**全部 6 個掛載面** ⇒ 下一個人收完 ③④ 會誤以為同族清零。**兩個子機制要分開看**:③ 是 `value` null→null 時 `useEffect([value])` 蓋不到;④⑤⑥ 是**出口路徑根本不看草稿**(送出/卸載/翻面時直接丟)。四條分別是〔🔴 **2026-08-07 補片 Part A + Part B 收線:③④⑤ 已收、⑥ 撤回(實查零可達=死碼,理由見 ⑥ 段末)⇒ 同族四條結案。但 Part B 的對抗審查另識別出 **3 條殘留**,明確未收、各有理由,不得視為同族清零:F3(手機面板內 `GarageChips` 出口繞過提示,記 MobileVehicleSheet 條目)/ F2b(購物車頂部整車套用從外部換掉行內 `value` 時舊提示殘留,記 CartPage 條目)/ F6(`role=\"status\"` 條件掛載、報讀器可能不播,兩處都有,記 CartPage 條目)**;③ 的收法=`Combo` 內 `useEffect(disabled → changeText(null))`,一處收 6 面、零 props 改動,詳 VehicleFinder 條目同日 [6 掛載面補片 Part A] 段落〕:③**停用欄位殘留草稿字(✅ 已收)**(**這一條本身是既有缺陷、非