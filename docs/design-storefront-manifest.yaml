        backlog: "🟡 **缺口①已收、缺口②只收一半(2026-08-07 Q8=A 接線片,Sean 拍板 A)**。🔴 **②的準確狀態(R3 對抗審查更正初版的「✅ 兩個缺口已收」= 過度宣稱)**:`InlineVehicleForm`「改用自行輸入」帶走草稿字這件事,**只在自由輸入欄目前是空的時候才發生**(守門 `name.trim() === ''`,R2 抓到不加它會蓋掉客人手打的車名)。⇒ **每一條編輯既有愛車的路徑**(`veh.name` 恆非空)、以及任何曾在自由欄打過字的新增路徑,缺口② **等於沒收**、草稿照舊無聲消失。另有一條**已申報的不對稱**:廠牌+車型**都選齊**時仍無條件以 `vehicleLabel` 覆蓋 `name`(含覆蓋客人手打的自由文字)—— 那是 HEAD 既有行為、V-1d「客人可改顯示名」的刻意設計,本片原樣保留。兩者都用測試釘住現況並就地註明「非規格、要改先問 Sean」。**要不要把②收滿是產品決策,已列給 Sean。** 原記載逐字保留備查:「已知缺口(未修、已用測試釘住現況並註明非規格):草稿是 `Combo` 的內部 state,父層看不到 ⇒ ①`MobileVehicleSheet` 的「清除」鈕只看已套用值 —— 欄位有字時鈕停用、而按得動時又清不掉沒選中那欄的草稿;②`InlineVehicleForm`「改用自行輸入」會讓草稿無聲消失。兩者同根因,修法要動共用 `VehicleCombo` 介面(4 個消費端),已提 D-274-STOP 交主視窗裁」。收法:`VehicleCombo` 新增 optional `onDraftTextChange`(不傳=行為零變動)⇒ ①`MobileVehicleSheet` 清除的可按條件改 `hasDraft || hasTypedText`,按下時另用 React key-reset 整批 remount 三顆欄位(光清父層 state 清不掉子元件內部草稿);②`InlineVehicleForm`「改用自行輸入」未選齊時帶「看得見什麼就帶什麼」的組合字面過去。兩條原本釘缺口的測試已依其就地註記**改斷言方向**(非把期望值改回去)。詳見 VehicleFinder / MobileVehicleSheet 兩條目的 `last_modified_date` 同日 [Q8=A 接線片] 段落。🔴 **同根因(`value` null→null 時 `useEffect([value])` 蓋不到)還有兩個症狀未收,R1 對抗審查抓出、Sean 未拍板故不在本片範圍,未修**:③**停用欄位殘留草稿字**(**這一條本身是既有缺陷、非本片造成**):車庫表單選了廠牌、車型欄打字沒選中,再把廠牌欄清空 blur(`onClear` 兩者都清 null)⇒ 車型欄變 disabled 卻仍顯示那串字。手機面板年份欄同構(選車型 → 年份打字沒選中 → 換廠牌 ⇒ 年份欄 disabled 仍顯示那串字)。⚠️ **本片給它接了一個新的下游**(R2 更正:初版把整條記成舊債=不精確):自由輸入欄為空時按「改用自行輸入」,那串殘留字會被帶成一個沒有廠牌的孤零零車型字面。🔴 **不要把它輕描淡寫成「不算 bug」**(R3 更正本欄初版):本片的下游把它從「停用欄位上的一串死字」升級成**會被存進客人車庫的車名** —— 而「客人看得到那串字所以帶走它合理」這個理由,對一個 **disabled 灰掉的欄位**站不住:UI 正在說那欄無效。真正該收的仍是上游「停用時就不該還顯示草稿」,但下游這半的嚴重度要照實記。④**套用會靜默丟棄未選中的草稿** —— 手機面板選了廠牌、車型欄打 `R6` 沒選中就按「查看適用商品」⇒ 只送廠牌、`R6` 無聲消失且面板關閉;父層現在**已經握有** `draftText` 這個資訊,卻沒用在 `canApply` 或送出前提示上。兩條都是 Q4=B「不讓客人打的字無聲消失」的同一族,建議下一片一起收。🔴 **④ 建議提前**(R3):父層現在**已經握有** `draftText`,加一句送出前提示是幾行的事;而本片收了兩個**入口**卻漏了最主要的那個**出口**(套用),客人觀感上只會覺得收了一半。R3 已實測 ④ 可構造:選 Yamaha → 車型打 `MT-0` 不選中 → 按「查看適用商品」⇒ dispatch 只有 `vehicle/select-brand`、面板關閉、`MT-0` 無聲消失且零提示"
