      last_modified_date: "2026-08-07 [中文排版六值片:解除 D5e-2b 的刻意緩辦、照 OD §6-1 全搬]:OD `N05-FOCUS-HANDOFF.md` §6-1「中文排版(這幾個是為中文重調的,不是隨意微調)」那張表,D5e-2b 當時**一個都沒搬**並在 `home.test.ts` 用守門正面釘住舊值、抬頭寫死解除條件;本片兌現、五個值逐條搬完,守門的**斷言與抬頭兩邊都翻**(審查抓到我第一版只翻了斷言、抬頭仍寫著「刻意不動、釘住舊值」——同一份聲明散在三處、我只翻了一處,是本 repo 記過的復發形狀),並新增一條「舊值不得躲進 @media 復辟」的守門:`.ed-feature-title` line-height 0.98→1.2(「1.02 給單行英文大標的,中文折兩行會黏住」)、letter-spacing -0.02em→-0.01em(「負字距是收拉丁字母用的,套方塊字會互相擠」)、新增 `text-wrap: balance`(「避免第二行只吊三個字」);`.ed-feature-body` line-height 1.75→1.85(「中文沒有字母上下伸展,行距要再開」)、max-width 34ch→30em(「`ch` 是拉丁字元寬,15px 下才 330px,中文會折成細長條」)。§6-1 表格第六列「資料條說明句:有→拿掉」**真站本來就沒有**(`FeatureEditorial.tsx` 的 meta 條只渲染 label + value)⇒ 無事可做、非漏做。⚠️ **OD 表格的「舊」欄與真站現值對不上**(OD 寫 1.02 / 40ch / 1.7,真站是 0.98 / 34ch / 1.75)⇒ 起點不同、終點一致 ⇒ 照新值搬,不去對齊一個真站不存在的舊值。🔴 **OD 的 `.b-feature-body` 另有一顆 `text-wrap: pretty`,刻意不搬** —— `[#223]` Sean 拍過板:pretty 在 iOS WebKit 對 CJK 段落會縮行造成右側留白(段落看似靠左而清單填滿、寬度不一致),body 文字一律移除;標題的 `balance` 保留。本片正是這樣搬的,已在 `home.css` 就地申報 —— 否則下一個「照 OD 補完」的人會把一個 Sean 否決過的值種回來。⚠️ 這組改的是**視覺重量**,文字層守不住好不好看 ⇒ **要 Sean 肉眼驗**(已列清單);審查另指出 900-1000px 平板段的內文寬度會一次變寬約 36%,是最該看的一檔。前:2026-08-06 [N°05 本月聚焦版面壓縮(OD 逐字段落標題 `963px 砍半`)]:只動版面尺寸(padding/grid/字級/meta 條/圖片比例),CTA 動線與資料流零改動。`.ed-feature` padding 140px 0→52px 0 56px;`.ed-feature-inner` gap 80px→48px(欄比例 5fr 7fr 本來就對——OD 基礎層雖是 6fr 6fr,但頁面根掛的「統一版面層」`.layout-unified .b-feature-inner{grid-template-columns:5fr 7fr}` 蓋掉它,5fr 7fr 才是實際生效值);`.ed-feature-num`/`.ed-feature-kicker` margin-bottom 18px/22px→12px;`.ed-feature-title` font-size clamp(48px,5.4vw,80px)→clamp(30px,3.2vw,46px)、margin 0 0 32px→0 0 18px;`.ed-feature-body` font-size 16px→15px、margin 0 0 40px→0 0 24px;`.ed-feature-meta` gap 24px→0 26px、padding 24px 0→16px 0、margin-bottom 36px→18px;`.ed-feature-meta-v` font-size 14px→15px、font-weight 500→600、補 line-height:1.3;`.ed-feature-media` aspect-ratio 7/8→16/11(OD 逐字,直式壓橫向);1000px 斷點同步壓(padding 80px 0→40px 0 44px、gap 40px→28px、新增 `.ed-feature-meta{grid-template-columns:1fr;gap:16px}` 單欄覆寫、圖