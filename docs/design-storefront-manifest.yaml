# Cross-cutting business overrides(全站機制、不屬單一元件)
cross_cutting_overrides:
  globalRwdMechanism:
    design_value: "純 [data-mobile=\"true\"] attribute selector(design SPA 由 MobileWrapper 包 <div data-mobile=\"true\">)"
    storefront_value: |
      雙保險:
      1. @media (max-width: 1079px) — viewport-based、SSR-safe、無需 JS
      2. <html data-mobile> 由 layout.tsx headers() UA regex 設(SSR hint、向後相容既有 [data-mobile] selector)
      5 個既有 css 檔(account / auth / filter-drawer / filter-top / header)全部 [data-mobile] 規則加 @media 鏡像並存、不刪既有規則
      ([#221] filter-top.css 拆檔後、其 [data-mobile] + @media(1079) 響應式規則整段移入 filter-responsive.css;規則字面零變、僅檔界搬移、concat 等價)
    decided_at: "2026-05-28"
    decision_source: "#192 plan v2(codex k1 FIX-1 修 selector + FIX-4 鐵則 4 三段不可拆豁免)"
    reason: |
      storefront 真實 markup 無人設 [data-mobile=\"true\"](g-2 肉眼驗實證 /account 手機爆版),
      純 attribute selector 不啟動;@media + UA hint 雙保險 SSR-safe + dev-preview 仍可強制 attr 模式
  productPageFullwidthPunctuation:
    design_value: "OD-6/7a 定『商品頁元件家族半形逗號慣例』:渲染文案半形逗號「,」/ 冒號「:」/ 問號「?」(頓號「、」句號「。」括號「（）」全形)"
    storefront_value: |
      [#223 Sean 2026-06-10 拍 Q2=B] 商品詳情頁散文家族**全改全形標點**、反轉上述 OD 半形慣例(業務 override、鐵則 1 例外):
      逗號「，」/ 冒號「：」/ 問號「？」/ 分號「；」全形;時間「10:00」/ 數字範圍「2–6」/ 金額「$100」/ 英文 / 程式碼維持半形。
      影響檔(渲染 prose):ProductTabs / ProductFAQ / ProductHighlights / ProductSpotlight / ProductSwatchWall / ProductFitments / GbRacingShowcase / BonamiciShowcase(#270 B S4/S5 新增、品牌形象區散文同屬商品詳情家族、逗號冒號括號全形)+ 品牌放量 9 家 showcase(#212、2026-07-10:Evotech/Lightech/CncRacing/EaziGrip/Samco/Motogadget/Front3d/Materya/Ebc,同家族適用)+ data/rpm-policies.ts。⚠️ 上列**是 #223 當時的影響檔清單、逐字保留**;其中 ProductHighlights / ProductSpotlight / ProductSwatchWall / GbRacingShowcase / BonamiciShowcase 與品牌放量 9 家 showcase 已於 H7(`c4a47484`,2026-08-07)整組刪除 ⇒ **現存受本 override 影響者只剩 ProductTabs / ProductFAQ / ProductFitments + data/rpm-policies.ts**。(🔴 本註記第一版由我自己複述清單、漏掉 GbRacingShowcase —— 改成保留原文再追加,就沒有複述漏員的機會。)
      同片附帶 product-page.css 兩改:① .pd-tab-pane max-width 820→960 對齊 .faq-body(Q1=A 換行寬統一最寬)
      ② 移除 .pd-body/.pd-lead/.pd-feature-desc/.faq-body 的 text-wrap:pretty(iOS WebKit 對 CJK 段落縮行致右側留白「靠左」、
      與 .pd-list 不一致;greedy wrap 填滿 = 用最寬;標題 .pd-h2/.pd-title 的 text-wrap:balance 保留)。
    decided_at: "2026-06-10"
    decision_source: "#223 Sean Q1=A(寬 960)/ Q2=B(全頁散文全形)/ Q3 批准;手機段落靠左 Playwright webkit 量證(402px 右白 62→4px)+ Sean iPhone 真機確認"
    reason: |
      Sean 要文案標點不可半全形混用(全形)+ 各分頁/FAQ 換行寬度一致(用最寬)。全形屬 Sean 業務拍板、覆蓋 OD 字面;
      8 元件(含 #270 B S4/S5 GbRacingShowcase/BonamiciShowcase)無另立 last_modified 條目、改動為跨家族單一決策、故記此 cross_cutting 段(對齊 globalRwdMechanism 前例)。⚠️ 「8 元件」= 當時的事實;H7(`c4a47484`,2026-08-07)刪掉品牌形象區整族後,現存受影響者為 ProductTabs / ProductFAQ / ProductFitments + data/rpm-policies.ts。
  textContrastLegibility:
    design_value: "OD/design-reference 次要文字灰階 --c-text-3=#a1a1aa(Zinc-400);design-reference 亦逐字使用此值(product-card/home/tweaks)"
    storefront_value: |
      [Sean 2026-07-09 拍 Q1=A、preview 肉眼驗過] 全站淺灰可讀性調深(業務 override、覆蓋 design 灰階、同 #223 精神):
      tokens.css --c-text-3 亮色 #a1a1aa(對亮底 2.45:1、CJK 難辨識)→ #71717a(4.63:1、過 WCAG AA);深色模式 #71717a→#8b8b94(4.10→5.86:1)。
      一次修好全站約 53 處吃此 token 的可讀內容(每張商品卡「適用車型」、原價、購物車品牌/單價/移除、篩選數量、表單標籤、麵包屑、頁尾等)。
      Q2=A --c-text-2(#52525b、已 ~7:1)不動、大段內文維持灰階層次。
      另 5 處硬寫/opacity 逐處修:product-page .pd-crumbs/.pd-vehicle-pill-x/.pd-spot-stats 的 #86868b→var(--c-text-3);
      .pd-install-cta-desc #cfcfd5(深底條、深色模式 bg 翻亮會消失)→ var(--c-text-inverse)+opacity 隨主題翻轉;
      account .acc-bike-meta/-stats span(白字@深卡)opacity 0.6/0.55→0.72/0.7;home .ed-footer-base rgba 白字 .45→.6。
      維持淡(keep-light、刻意不調):.ph 佔位 / disabled 狀態 / 分隔符號 / svg 圖示 / 裝飾編號。
    decided_at: "2026-07-09"
    decision_source: "全站稽核 workflow(108 findings、主兇 --c-text-3 亮 2.45:1)→ Sean 拍 Q1=A 全站調深 + Q2=A text-2 不動;preview 肉眼驗 OK"
    reason: |
      Sean 反映「太多淺灰色的字體、真的很難辨識」、要求改設計權威此部分。#a1a1aa 對 CJK 內文對比不足;
      調深一顆 token 即 DRY 修好全站、rollback = 改回 hex。動 tokens.css = 覆蓋 design 灰階(鐵則 8 已 Sean 批)。
      未同步回 design-reference(兩邊值暫不一致、記此;未來可選同步)。

components:
  # ---- 商品系列(M-1-13H 改版完成、M-1-13I 修 3 bug 範圍) ----

  ProductsPage:
    storefront:
      component: "apps/storefront/src/components/ProductsPage.tsx"
      css: "apps/storefront/src/styles/products-page.css"
