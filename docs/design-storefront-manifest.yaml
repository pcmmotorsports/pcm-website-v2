        storefront_value: "`lib/brand-focus.ts` 的 `taipeiDayNumber()`:用 `toLocaleDateString('en-CA', { timeZone: 'Asia/Taipei' })` 取台灣曆日再以 UTC 午夜解析成整數日,起算日同樣以 UTC 午夜解析 ⇒ 兩邊都是純曆日、相減與執行環境時區無關"
        decided_at: "2026-08-05"
        decision_source: "**施工端技術判斷**(非 Sean 拍板)—— 故放 `technical_overrides` 而非 `business_overrides`(主視窗 C-96-A ②:先照 B 的形狀做,Sean 裁示 A/C 再改鍵名)。理由:OD 那個字面沒有時區後綴 ⇒ **依執行環境的本地時區解讀**,同一份 code 在不同機器上換人的時刻不一樣。本實作改算「絕對曆日」(顯式 `Asia/Taipei` 取曆日 + 起算日 `T00:00:00Z` 解析)⇒ **對執行環境時區完全免疫**,不論 server 設成什麼,換人一律落在台灣的午夜。客人在台灣。(R3 F6 更正:原本把理由寫成「正式站 server 跑 UTC」—— 那是我沒實測過的部署事實,而且會讓未來的人以為「把 server 設成 Asia/Taipei 就能改回照抄」。)同族坑見 memory `project_m4b-a9d2-1-note-action-decisions`(`datetime-local` 無偏移 + server UTC ⇒ 時間差 8 小時靜默入庫)"
        backlog: "—(無獨立條目;本片內解決)"
        reason: "🔴 **守門本身差點是假的**:開發機實測 `Intl.DateTimeFormat().resolvedOptions().timeZone === 'Asia/Taipei'` ⇒ 在這台機器上把實作裡的 `timeZone` 選項整個拿掉,時區斷言**照樣全綠** —— 也就是「會出事的環境(UTC server)」正好是「測不到的環境」。修法:`brand-focus.test.ts` 開頭 `process.env.TZ = 'UTC'` **並附前提斷言驗證它真的釘上了**(沒釘上就大聲紅,不讓整組斷言默默退化成恆真);釘 UTC 後拿掉 `timeZone` 的突變實測轉紅。屬 memory `feedback_fixture-value-makes-guard-vacuous` 那一族。"

