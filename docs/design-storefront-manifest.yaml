        decision_source: "①不報品牌家數 = Sean 拍 Q1=B(主視窗轉達,信 `pcm-mailbox/C-84-A.md` 第 3 點逐字「不報數。字面用 Sean 已過目的例句『原廠正式代理,每件附序號與保固卡』為預設,肉眼驗時他可再改」);題目出自 `docs/specs/2026-08-05-d5-home-reorder-plan.md` §5 Q1。②永久拿掉保固卡句 = Sean 追認 B,信 `pcm-mailbox/C-92-A.md` 逐字「平行輸入品不一定都有 ⇒ 該句永久拿掉、不是暫時」+「措辭照『永久』寫,不留『待確認』字樣」。③不報店家家數 = Sean 拍 Q4=C,信 `pcm-mailbox/C-90-A.md` 第 4 點逐字「拿掉不報數 ⇒ **頁面層家數守門的唯一豁免同步移除=守門變全面**」(同段另見 `C-100-A.md` 第 Q4 點)。(R2 nit 更正:原欄只列 ①,照本欄追的人查不到 ②③ 那兩板。)"
        backlog: "#271(信任狀數字 hardcode 無後台 CRUD;本片移除首頁這一顆硬編數字、該條未收案)"
