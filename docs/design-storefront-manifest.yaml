      css: "apps/storefront/src/styles/home.css"  # `.js-reveal` / `[data-reveal]` / `.ed-feature` 兩欄那組
      last_modified_commit: "4833eaf"  # 記可達祖先=D5g 的父 commit(#180 案 A)
      last_modified_date: "2026-08-05 [D5g 捲動進場(主視窗 C-119-A 指派;OD 暫不可寫故先做這片)]:新建。首頁五個區塊(N°02 商品 / N°03 分類 / N°04 服務 / N°05 聚焦 / N°06 磚牆)捲進視窗才淡入上移;**Hero 不掛**(首屏載入即可讀)。規格逐字照 OD `N05-FOCUS-HANDOFF.md` §6-4:位移 34px、0.7s、`cubic-bezier(.2,.8,.2,1)`、N°05 照片比文字晚 140ms、`rootMargin '0px 0px -12% 0px'`、`threshold 0.05`、一次性 `unobserve`。🔴 **這支不 render 任何東西也不包 children(回 `null`)**:**`HomeReveal` 沒有讓任何一塊多轉 client**(handoff 逐字「不要為此把整個資料渲染改成 client」)。⚠️ **措辭更正(R1)**:我原本寫「五個區塊全部維持 server component」是**假的** —— `HomeSelect.tsx:15` **本來就有 `use client`**(它用 client component `ProductCard`),與本片無關;我當初查證時用 `head -1` 只看到該檔第 9 行那句**註解**就下結論,證據被截斷。R1 實查 `.next/server/app/page_client-reference-manifest.js` 確認:`CategoryGrid`/`HomeStatement`/`BrandIndex`/`FeatureEditorial` 四塊**不在**其中(真 server component),`HomeSelect` 早在本片之前就是 client—— 比 wrapper 更小,且不會被誤讀成「這塊要改 client」。🔴 **修的是真 bug**:原本 N°05 是「render 完就加 class」= 頁面一載入就跑,而它在整頁最下面 ⇒ 滑到那裡動畫早就結束、等於做了等於沒做。**不得退回載入即觸發的寫法**。三個坑逐條照做:①起始隱藏掛 `body.js-reveal`,而該 class **只在「有 IO 且未開減少動效」時才加** ⇒ JS 掛掉整頁維持全可見 ②雙層 `requestAnimationFrame`(少了它 observer 第一次回呼與建立狀態擠同一幀、元素直接跳到完成樣子)③失效保險(2 秒)**必須先確認一個都沒進場**才補救,無條件補救等於一次全開。⛔ **不搬** OD 的 `?replay` 重播鍵(校對台工具)。🔴 **實作漏洞由守門抓出**:第一版用 `'IntersectionObserver' in window` 判斷,但 key 存在而值為 `undefined` 時仍為真 ⇒ 會先把整頁藏起來再於 `new IntersectionObserver` 拋錯、**內容永久隱形而三綠全過**;已改 `typeof … === 'function'`。⚠️ `cancelled` 旗標**構造不出負測**(拿掉行為完全相同,真正擋住的是 cleanup 的 `cancelAnimationFrame`)⇒ 已在檔內標明它是 defence in depth、**不是承重點**,不誇大。守門 = `HomeReveal.test.tsx`(**11 條**,含五條退場:無 IO / 減少動效 / 零目標 / 建構子拋錯 / observer 沒接上,皆不得留下 `js-reveal`)+ `styles/home.test.ts` 新增 **7 條**。突變 **12 組**各自轉紅。🔴 **R2 兩條 must-fix 已折入**:①失效保險判準由「有沒有人進場」改成「**observer 到底有沒有接上**」並移出 rAF —— 實測第一個目標 `.ed-select` 在桌機 1440x900(top=1130)與手機 390x844(top=1238)**都在首屏外**,「沒人進場」是正常狀態,舊判準會在**每一次正常首載**第 2 秒把五段一次全開 = 進場動畫等於沒做;且 rAF 在背景分頁完全暫停(R2 實測 `rafHidden=0` / `timerHidden=13`),巢在 rAF 內註冊的保險根本掛不上。**這是申報偏離 OD 字面**(§6-4 第③點寫「先確認一個都沒進場」),但那一點的**意圖**正是「observer 沒接上才補救」,OD 原型自己也踩了同一個坑。🔴 **R3 再修一層**:保險判準又從「`observer` 物件存在」收緊成「**observer 回呼過**」——建得起來 ≠ 會動(目標在 `display:none` 祖先下 / 被移出 DOM / 實作被閹割時,物件在卻永遠不回呼)⇒ 用「物件存在」當判準會讓保險**自廢**而沒人來掀 = 永久隱形。真的 IO 在 `observe()` 後必送初始回呼,故正常情況不誤觸發(真瀏覽器實測:等 3.6 秒不捲動,五段仍未進場;捲到 N°06 才單獨進場、opacity 抓到 0.953 過渡中)。⚠️ 連帶修 fixture 保真度:`FakeIO` 原本**永遠不回呼**,把「活著的 observer」演成「啞掉的」⇒ 測到的是不存在的情境;已補初始回呼,並新增「observer 建得起來但永遠不回呼」的負測。②起始隱藏改成只作用於帶 `data-reveal-armed` 的元素(JS 逐個認領)—— 原本「藏是全域、掀是逐個快照」不對稱,mount 後才進 DOM 的目標(`{focus && <FeatureEditorial/>}`、`CategoryGrid` 的 `cats.length === 0 → return null` 由無變有)會永久 `opacity:0`。"
