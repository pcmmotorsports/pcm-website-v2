        storefront_value: "M-4a B-3 net-new business override：收件資料區加入 Email 欄與『此信箱也可能用於信用卡付款驗證』；一般真 Email 可預填，LINE 合成域/壞值留空。單一 strict opt-in flag 同控 UI、client payload、server schema、RPC 8/9 參數形狀；本片 on 路徑第 9 參固定 null，canonical 真值持久化與 TapPay 三分支留 B-4"
        decided_at: "2026-07-20"
        decision_source: "B-0 PRD §3.3/§3.4/§4 B-3 + Sean Q1=A 批准 B-3/B-4 邊界"
        reason: "通知信箱是已核准的交易需求、design 無此資料欄；沿用 auth-field 與 checkout token，不重畫結帳。文案屬 L1 靜態揭露"
