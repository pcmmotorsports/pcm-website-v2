        storefront_value: "Sean 2026-08-07 三拍板合成的一組行為(**三掛載點與桌機/手機選車器共用同一顆 `VehicleCombo`,本條為全站唯一記錄處**):①**Q4=B 留字**——blur 時非唯一精確命中則不套用、但**不清掉使用者打的字**(舊行為是清空;Sean 回報那是『打了字、滑開就無聲消失』)。②**Q7=A 已選定則還原**——留字只適用**尚未選到值**的欄位;欄位已選定 → blur 仍還原成已選那個(畫面=事實)。守門畫在**不變量的面**而非只畫在 blur:`value` 從外部變動時(跨層選車回填廠牌 / GarageChips 一鍵套用 / URL 同步)一律丟棄過期草稿。③**Q6=A 零命中出路**——留字之後點回欄位、零命中時顯示提示;拍板字面是**復用既有句、不寫新句**,實作=把四句零命中文案收成單一常數 `VEHICLE_EMPTY_HINTS`(原本逐檔硬編在 4 個檔)並補齊所有 11 個選車欄位。🔴 零猜鐵律全程未鬆動:自始至終不 onPick、不半套、`value` 不被草稿改動。④**`onDraftTextChange` 的卸載契約(2026-08-07 Fable 補審 nit②,主視窗要求記進本條)**:**元件卸載時不回報** —— 卸載後父層手上仍是最後一次回報的字。現有兩個接線端都自救(手機面板按清除時顯式 `setDraftText(EMPTY_TEXT)`、車庫表單靠 remount 後 mount effect 補報 `''`),**但那是巧合不是保證**:未來若有第三個掛載點**條件渲染單顆 `Combo` 且自留 text state**,卸載期間讀 `draftText` 會拿到幽靈字。原本這條只寫在 `VehicleSelect.tsx` 的 prop JSDoc 裡,現同步落在本條 —— prop 註解會被跳過,契約檔不會。⑤**停用即丟草稿(2026-08-07 補片 Part A 收債③;本條 ① 的一道例外,SOP⑥ code-reviewer 要求落在契約檔而非只落在 .tsx 註解)**:`disabled` 為 true 時(false→true 轉態,**以及掛載當下就已停用**——effect deps 是 `[disabled, changeText]`、掛載也跑一次),`Combo` **一律丟掉草稿**(清內部 `text` + 回報 `''`)⇒ ① 的「Q4=B 留字」只適用**啟用中**的欄位。理由=欄位停用 ⟺ 它的選項空間整份換掉(車型欄停用 ⟺ 廠牌被清空;年份欄停用 ⟺ 車型沒選或該車型無年份),舊草稿已無對應選項;不丟的話那串字會被下游 `InlineVehicleForm`「改用自行輸入」組進客人車庫的車名 —— 一個 **disabled 灰掉的欄位**上的殘字被當成資料。🔴 這是全站 6 個掛載面**同時**生效的行為改動(改在 `Combo` 內部、零 props 改動、零呼叫端改動)。🔴 **副作用已揭示、待 Sean 肉眼驗**:這個修法**本身就是一次無聲丟字**(車型欄打了字沒選中 → 清空廠牌 → 那串字無提示地不見),方向與 Q4=B 那句抱怨「打了字滑開就無聲消失」同一種體感。理由(選項空間整份換掉、留著會被存成車名)成立且 plan 已批,但值得他實機看一眼。"
