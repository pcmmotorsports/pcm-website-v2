        storefront_value: "🔴 Sean 已批准的 business override(非 design 原樣搬運):**兩步結帳**——Step 1 收件資料/配送/通知 Email;Step 2 發票 + 付款 + 真 TapPay 卡欄 + 商品複查 + 條款 + 確認付款(單欄連續式)。**U1 落地範圍**:step domain 原子收斂為 `CheckoutStep = 1 | 2`(型別源 apps/storefront/src/components/CheckoutStepIndicator.tsx、自 CheckoutView 抽出;步驟列兩格「收件資料 / 發票與付款」、只有已完成步驟可回點);同片 `useTapPayCard(step === 3)` → `(step === 2)`(不留中間斷裂 commit);Step 1 CTA 改「下一步:發票與付款」;「下一步:確認訂單」移除;mobile buybar step===2 顯「應付總額」、step===1 才顯下一步鈕。🔴 **安全契約零變更**:TapPayCardFields 仍是唯一卡片輸入表面、PAN/有效期/CVV 只在 TapPay iframe;hook generation guard／active=false 即清 state／重入重 setup／getPrime 15s timeout 全留;confirmProceedIfInflight → getPrime → charge.submit 順序與 primeBusyRef 同步鎖、終態不釋放策略未動;agreed server guard／金額重算／tier／RLS／cart session／3DS callback 皆未碰。✅ **U2b(2026-07-22)起兩步內容已完成**:Step 2 = 精簡收件摘要 + 發票 + 付款方式〔內含唯一真 TapPay 卡欄〕+ 商品清單 + 條款 + 確認付款,由單一 CheckoutStep2 元件承載;三步版 shell CheckoutStep3.tsx 已退役刪除、disabled 假卡欄與重複同字面節點全部清除。(歷史:U1 只搬骨架、Step 2 內曾依序掛 CheckoutStep2 + CheckoutStep3 兩元件而產生重複節點與假卡欄;U2a 把收件摘要 / 付款 body / 商品 + 條款抽成 CheckoutStep2ReviewSections,屬純內部重構、客人畫面零變動。)✅ **U3a**(canonical invoice schema)與 **U3b**(非卡片全錯誤 state 與 ARIA)**已完成**;⚠️ ✅ **U4a-U5(2026-07-23)已完成**——卡欄逐欄自清、聚焦第一錯誤、付款中遮罩(原生 dialog top layer)鎖定整頁取代逐一鎖回頭路;⚠️ 仍未完成=L1 正式法律頁,不得稱 production checkout 完成"
