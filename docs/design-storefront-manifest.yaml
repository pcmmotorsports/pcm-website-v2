        storefront_value: "storefront 改 `top: calc(var(--shell-header-h) + 23px)`(#408①)。**呼吸值 23 與 design 逐字一致、沒有改**;差額全部來自頁首高 token:桌機 73 ⇒ 仍是 96px(**與 design 同值**),而 ≤1079 頁首收窄成 60 ⇒ 該區間變 83px。design 那顆 96 是單一斷點的攤平值,storefront 的頁首高有兩個斷點"
