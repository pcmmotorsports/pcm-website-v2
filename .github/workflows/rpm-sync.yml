# 供應商每日同步(報價單 B庫 → 網站庫)— S5 排程上線;V1 多供應商 matrix(2026-07-05)
#
# 每天台灣 12:30(UTC 04:30)自動跑全量同步 + S4 下架對賬 + V1 變體級對賬 + S5 W1 抓取完整性 gate。
# 🔴 2026-07-22 由台灣 03:00 改為 12:30(需求單:報價單 repo docs/handoff/REQ-2026-07-22-網站庫同步時間.md)。
#   原因:報價單側 2026-07-22 把爬蟲排程整批搬到清晨(台灣 03:30-04:20 十二家爬蟲 → 06:00 分類重算
#   → 11:30 報價單庫→網站庫 fitment 同步)。12:30 在上述四段的**排程順序之後**。
#   ⚠️ 不可再往前搬到 11:30 之前,否則退回同一個問題。
#
# 🔴 **舊排程的真實症狀比需求單描述的更糟(2026-07-22 以 28 次歷史執行實測、非推論)**:
#   舊 cron 表訂台灣 03:00,但 GitHub 排程延遲實測 **最小 55 分 / 中位 72 分 / 最大 111 分**
#   → 實際開跑落在 **台灣 03:55-04:51**,正好**壓在爬蟲視窗 03:30-04:20 之內或其後緣**。
#   所以舊行為不是需求單寫的「必然拿到前一天資料」,而是**讀到「爬蟲還在寫」的部分更新狀態**
#   (某些供應商已更新、某些還沒)。⛔ ~~新排程把這個重疊完全消除。~~
#
# 🔴 **2026-09-07 `-auth` 實測訂正 —— 而錯的不是上面那組數字, 是【最後那句結論】**:
#   上面「55/72/111 分」綁著**舊 cron(台灣 03:00)**、2026-07-22 量的, 那個範圍是對的、也標了時點。
#   🛑 **而新 cron `30 4 * * *`(UTC 04:30 = 台灣 12:30)【也在延遲, 而且更久】** ⇒ 「完全消除」沒有被新資料支持。
#   🔬 數法 `gh run list --workflow=rpm-sync.yml --json createdAt,event,databaseId`, 只取 `event=schedule`,
#      `createdAt` 加 8 小時換算台灣(2026-09-07 13:3x CST 撈, 最近 11 發):
#        34022762858 09-06 16:45 · 33955358594 09-05 16:28 · 33855954275 09-04 16:57
#        33736783686 09-03 17:04 · 33611303680 09-02 16:55 · 33492665580 09-01 17:31
#        33385043577 08-31 19:01 · 33305473928 08-30 18:01 · 33249762645 08-29 19:17
#        33191660971 08-29 00:47 · 33087489540 08-27 23:22   ← 🔴 這兩發落在【深夜】
#   ⇒ 📌 **9 發落在台灣 16:28-19:17(晚 4-6.75 小時), 而另外 2 發完全不在那個帶** ——
#      **⇒ 開跑時刻【不可預測】, 不要用一個預測時刻去規劃迴避。**
#   ✅ **可執行的做法**:要避開排程時, **當下去看 Actions 有沒有 running/pending 的 `rpm-sync`**,
#      而不是「挑一個看起來安全的時間」。⚠️ 本訂正只量【何時開跑】, 沒有重量爬蟲視窗那一半。
#
# 🔴 **誠實邊界:12:30 只是「排在上游之後」,不是「上游已完成」的保證。** 兩個 repo 之間
#   **沒有任何完成訊號 / preflight / 失敗閘**,本 workflow 不會知道上游有沒有跑成功:
#   ① 報價單側防睡鎖 caffeinate 只覆蓋台灣 03:22-07:17(見該 repo launchd/com.pcm.morning-awake.plist),
#      **11:30 的 fitment 同步落在防睡鎖放開之後 4 小時**、該機 pmset 閒置 1 分鐘即睡
#      → 可能發生該 plist 註解自述的「跑起來但網路不通的假失敗」(2026-07-22 lightech/samco-stock 即此下場)。
#   ② 11:30 若失敗或延遲,12:30 仍會照跑並同步到**更舊**的 fitment。
#   → 上游完成訊號 / preflight 是**未做的工作**,已於 2026-07-22 raise 給 Sean(跨 repo、非本 repo 可單獨解)。
# plan:docs/specs/2026-06-03-S5-scheduling-plan.md(Sean 拍 Q-S5-platform=A)。
# V1 matrix(2026-07-05 雙跨模型審查 must-fix、Sean 拍 gbracing+bonamici 上架):每家一個獨立 job
#   跑「自己完整一輪」(不變式 1 軟下架隔離);fail-fast:false = 一家 gate abort 不拖垮別家;
#   max-parallel:1 = 序列寫同一 DB、降低併發寫入面。matrix 涵蓋全「需每日同步」品牌(2026-07-12 Sean 拍「所有品牌每日同步」);lightech+kspeed 2026-07-24 首灌後補入;🔴 extreme 為靜態一次性 fixture、刻意不列(supplier-config.ts:275-286)。
#
# ⚠️ 已知陷阱:GitHub scheduled workflow 60 天無 repo 活動會被自動 disable(**本 repo 實查為 public、規則適用**)
#   (無人值守需週期性 repo 活動或定期到 Actions 頁確認仍啟用)。
# 告警:⛔ ~~失敗走 GitHub Actions 預設 email(寄給上次改本檔者);LINE/webhook 升級留 follow-up。~~
#   🔴 2026-09-12 訂正兩件事:
#   ① **「寄給上次改本檔者」是錯的** —— 實查 09-10 那次失敗的 run,`actor` 與 `triggering_actor`
#      都是 `pcmmotorsports`(repo owner)⇒ 預設信寄給**他**,不是「上次改本檔的人」。
#   ② 預設信會不會被**看到**取決於他 GitHub 帳號的通知設定與信箱過濾,**我們這一端量不到**
#      ⇒ Sean 2026-09-12 拍甲:另外寄一封到客服信箱。做法見本檔最後的 `notify-failure` job
#        (沿用站台既有的 Resend 管道,收件人吃 `SYNC_ALERT_TO`,不新引入服務)。
#   🛑 **缺跑偵測仍然沒有** —— 本 job 守的是「跑了而失敗」,**不是「該跑而沒跑」**(見上面 cron 那段)。
#
# 🔴 安全:secrets 走 ${{ secrets.* }} 注入 env、絕不 echo 到 log;只用已驗 action;
#   on 限 schedule + workflow_dispatch(不掛 pull_request/pull_request_target、secret 不給 fork PR);
#   permissions 收最小(contents: read、本 job 不寫 repo)。
# secret 設定步驟見 docs/specs/2026-06-03-S5-scheduling-plan.md §10(Sean dashboard 操作、Code 不碰金鑰值)。

name: Supplier Daily Sync

on:
  schedule:
    # ⚠️ **本檔未設 timezone → 走 GitHub 預設的 UTC**;勿在此填台灣時間。
    #   UTC 04:30 = 台灣**同日** 12:30(UTC+8 全年無夏令時)。
    #   (前值 '0 19 * * *' = UTC 19:00 = 台灣**次日** 03:00;2026-07-22 改,理由見檔頭。)
    # ⚠️ 排程時間是**最早觸發時間、不是保證**:GitHub 高負載時會延遲、甚至**整次丟棄**,官方未給上限。
    #   🔴 **本 workflow 實測(2026-07-22、28 次 schedule 觸發):延遲 最小 55 分 / 中位 72 分 / 最大 111 分。**
    #   → ⛔ ~~表訂台灣 12:30 的**實際開跑預期 ≈ 台灣 13:25-14:21**(仍安全落在 11:30 fitment 同步之後、餘裕約 2 小時)。~~
    #   ⛔ ~~⚠️ 寫「12:30 跑」是表訂值;要講實際行為請用 13:25-14:21。~~ 延遲量取決於當下 GitHub 負載、不保證。
    #
    # 🔴🔴 **2026-09-07 `-auth` 實測訂正 —— 上面那個 13:25-14:21 【不要拿來挑時間】**
    #   🔬 數法 `gh run list --workflow=rpm-sync.yml --json createdAt,event,databaseId`, 只取 `event=schedule`,
    #      `createdAt` 加 8 小時換算台灣(2026-09-07 13:3x CST 撈, 最近 11 發, 附 run id):
    #        34022762858 09-06 16:45 · 33955358594 09-05 16:28 · 33855954275 09-04 16:57
    #        33736783686 09-03 17:04 · 33611303680 09-02 16:55 · 33492665580 09-01 17:31
    #        33385043577 08-31 19:01 · 33305473928 08-30 18:01 · 33249762645 08-29 19:17
    #        33191660971 08-29 00:47 · 33087489540 08-27 23:22   ← 🔴 這兩發落在【深夜】
    #   ⇒ 📌 **9 發落在台灣 16:28-19:17(晚 4-6.75 小時), 另 2 發完全不在那個帶**
    #      ⇒ **開跑時刻【不可預測】** —— 13:25-14:21 那個區間**沒有一發命中過**。
    #   ✅ **可執行的做法**:要避開排程時, **當下去看 Actions 有沒有 running/pending 的 `rpm-sync`**,
    #      而不是「挑一個看起來安全的時間」。
    #   ⚠️ **射程**:本訂正只量【何時開跑】—— **上面那句「仍安全落在 11:30 fitment 同步之後」我沒有重量**,
    #      而如果真的開跑在 16:28-19:17, 那個「餘裕約 2 小時」的計算也跟著失效, **要有人重算**。
    #   缺跑偵測目前**沒有**(見下方告警段)。
    - cron: '30 4 * * *'
  workflow_dispatch: # 手動觸發(GitHub 預設限有 write 權限的 collaborator)
    inputs:
      dealer_price_checksum:
        # 🔴 **經銷價首灌的【事前綁定】** —— 沒有它,「核准的那批」與「真正寫進去的那批」之間
        #   沒有任何關係:正式跑會**重新讀來源**,而來源每天在動。
        #   ⇒ 本機 dry-run 印出 sha256, 貼進這裡;寫入前重算比對, 不同就走 A1(那一家帶舊值), 不寫新值。
        # 🔵 **留空 = 不比對**(排程觸發本來就沒有 input)⇒ 對 18 家的日常同步零影響。
        description: '經銷價批次 sha256(本機 dry-run 印的那個;留空 = 不比對)'
        required: false
        type: string
        default: ''

# W2 並發互斥:cancel-in-progress:false = 不 cancel 進行中(reconcile 寫到一半被砍會留髒中間態)。
# 🔴 更正(2026-07-22 codex 審查):原註解「後到的 run 排隊」不精確 —— GitHub 同一 concurrency group
#   最多保留 **1 個 running + 1 個 pending**;第三個 run 會**取代**既有 pending(該次等於被丟棄)。
#   排程與 workflow_dispatch 重疊時可能漏掉一次同步,且不會有失敗通知。
concurrency:
  group: rpm-sync
  cancel-in-progress: false

# 最小權限:本 job 只讀 repo(checkout)+ 對外連 Supabase、不寫 repo。
permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    # 🔴🔴 2026-09-04 補(code-reviewer F2 點名, 而它不是 dbk 才有的問題):
    #   本 job 原本【沒有 timeout-minutes】⇒ 走 GitHub 預設 **360 分**。
    #   而 max-parallel:1 ⇒ 序列跑 ⇒ 🛑 **任何一家卡住, 排在它後面的全部跟著等, 最多 6 小時**。
    #   🔬 而實測全 matrix 跑完是 **10-13 分鐘**(:69 那段, 近 12 次執行)
    #   ⇒ 45 分 = 實測上限的 ~3.5 倍 ⇒ 正常波動撞不到, 而真的卡住時 45 分就死而不是 6 小時。
    #   ⚠️ 這是【每一家】的上限, 不是整個 matrix 的 —— matrix 是 ⛔ ~~17~~ ⇒ ⛔ ~~18~~ ⇒ **19** 個獨立 job
    #      (2026-09-04 加 rizoma;2026-09-08 加 wrs。數法 = 數下面那一行方括號裡的項目, 不要照抄本句)。
    #   🔴 **而這個數字會在每一次加一家的時候過期, 而沒有東西會叫** —— codex 對抗審查抓到的那一發
    #      就是「加了 dbk 而這裡還寫 17」。📌 加家的人:改 matrix 的同一秒改這一行。
    timeout-minutes: 45
    strategy:
      fail-fast: false # 一家 gate abort(如 #261 新分類)不中斷其他家同步(審查 S1:防跨供應商耦合)
      max-parallel: 1 # 序列跑:同一 target DB、避免併發寫入面(各家 scope 本已隔離、此為保守層)
      # 🔴 總執行時長實測(2026-07-22、近 12 次執行):**0.17-0.22 小時 = 約 10-13 分鐘**(整個 matrix 12 家序列跑完)。
      #   → ⛔ ~~各 job 6h 上限推出的「最壞 72 小時」~~ **已作廢** —— 上面 `timeout-minutes: 45` 之後
      #      每 job 上限是 **45 分**(最壞 ⛔ ~~18 × 45 分 = 13.5 小時~~ ⇒ **19 × 45 分 = 14.25 小時**,
      #      2026-09-08 加 wrs 後重算);原句是那道 timeout 加上去【之前】的算式。
      #      🔴 **這個算式每加一家就過期一次, 而沒有東西會叫** —— codex 對抗審查 2026-09-08 又抓到同一發
      #      (它 09-04 抓的是「加了 dbk 而還寫 17」)⇒ 📌 **同型第二次 = 那不是誰不小心, 是這裡缺一道閘。**
      #      而它與實況(10-13 分)仍差兩個數量級;12:30 開跑約 13:40 前結束。
      matrix:
        supplier: [rpm, gbracing, bonamici, cncracing, evotech, eazigrip, samco, motogadget, front3d, materya, ebc, akrapovic, lightech, kspeed, dna, gilles, dbk, rizoma, wrs] # 🔴 wrs 2026-09-08 Sean 拍板「開」批首灌後【同一顆 commit】補入(同 dbk / rizoma 的走法:翻 writeAllowed 的那一秒 supplier-config↔matrix 對帳測試當場紅, 就是它提醒補的);⚠️ 而本行加了第 19 家 ⇒ 上面那段時長算式的家數又過期一次, 刻意不改寫、當場重量才算數。全「需每日同步」品牌(2026-07-12 Sean 拍「所有品牌每日同步」);akrapovic 07-19 首灌後加入;lightech+kspeed 2026-07-24 首灌後加入(lightech 原 #275 除外、已開寫);🔴 extreme 刻意不列(supplier-config.ts:275-286 靜態一次性 fixture、不接每日排程;原註寫 :249 是假行號、那裡是 ebc 區 —— R3 F6);samco 14165 變體序列跑較久但各 job ⛔ ~~6h~~ ⇒ **45 分**上限(:72);🔴 dbk 2026-09-04 Sean 逐字「甲 上」批首灌後【同一顆 commit】補入(而那道 supplier-config↔matrix 對帳測試在翻 writeAllowed 的那一秒當場紅, 就是它提醒補的);🔴 rizoma 2026-09-04 Sean 逐字「`q3: 上`」批首灌後【同一顆 commit】補入(同 dbk 的走法:翻 writeAllowed 的那一秒對帳測試會紅);dna+gilles 2026-08-27 Sean 拍甲補入 —— 兩家【首灌後漏加】, 顧客站價格凍在首灌快照而來源每天更新;病灶=決定寫在 supplier-config.ts 那句「起排入每日班」而沒寫進本檔, 兩支之間零對帳;⚠️ 上面時長實測綁著它自己的 12 家、刻意不改寫成現值, 且 dna/gilles 實際時長未量(理由與數法見該 commit body)
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false # 同步腳本不需 design-reference submodule

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run supplier sync (full + S4 reconcile + V1 variant reconcile + S5 W1 gate)
        # secrets 注入 env;runner 無 .env.local、rpm-import existsSync 守會走此 process.env(S5-pre B1)。
        env:
          QUOTE_SUPABASE_URL: ${{ secrets.QUOTE_SUPABASE_URL }}
          # 🔴 2026-09-08 由 PUBLISHABLE(anon, statement_timeout 3s)換成 SECRET(service_role)。
          #    ⚠️ service_role 的天花板是 8 秒(吃 authenticator 的 rolconfig), **不是 120 秒**。
          #    來源最慢的 gilles 壓在 anon 的 3 秒邊界上、時好時壞;逐家實測數字與取捨(service_role
          #    對來源庫繞過 RLS)見 scripts/rpm-import.ts 檔頭 env 段。
          #    舊 secret QUOTE_SUPABASE_PUBLISHABLE_KEY 刻意留在 GitHub Secrets 不刪, 回滾就改回這一行。
          QUOTE_SUPABASE_SECRET_KEY: ${{ secrets.QUOTE_SUPABASE_SECRET_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          # 🔴 經銷價那一半。**兩個都留空時 = 今天的行為**(不接上游、帶本站舊值、不清價)。
          #   ⚠️ `DEALER_PRICE_SUPPLIERS` 是 allowlist(逗號分隔);**改它的人每次貼完整名單,不貼增量** ——
          #     `gh secret set` 沒有 append 語意,取代成別家會讓前一家【凍在舊值而畫面全綠】。
          #   🛑 URL 只認這一個變數;碼不得 fallback 到 pg 的 `PGHOST`/`PGPASSWORD` 預設(靜默 fallback)。
          DEALER_PRICE_DATABASE_URL: ${{ secrets.DEALER_PRICE_DATABASE_URL }}
          DEALER_PRICE_SUPPLIERS: ${{ secrets.DEALER_PRICE_SUPPLIERS }}
          # 🔵 排程觸發時 inputs 不存在 ⇒ 這裡是空字串 ⇒ 不比對(見上面 inputs 那段)。
          DEALER_PRICE_EXPECT_CHECKSUM: ${{ github.event.inputs.dealer_price_checksum }}
          # 🔴 **顯式注入事件名, 不依賴 runner 的預設 `GITHUB_EVENT_NAME`** ——
          #   判準要看得到、也要在本機跑得出來(本機沒有那個預設變數)。
          #   ✅ `workflow_dispatch` ⇒ 一律要 checksum(首灌與中途失敗補跑【都是】dispatch);
          #     `schedule` ⇒ 不要(日常同步照常跟上游)。
          #   🛑 這樣就不必從【資料】猜「是不是首灌」—— 而猜資料那條會被部分寫入騙。
          DEALER_PRICE_TRIGGER: ${{ github.event_name }}
        run: pnpm exec tsx scripts/rpm-import.ts --confirm-write --supplier=${{ matrix.supplier }} # tsx 已釘 devDep(--frozen-lockfile 裝固定版、不每天抓 latest、防供應鏈)

  image-trim-scan:
    needs: sync
    if: ${{ !cancelled() }} # cancel 時不跑、sync 部分失敗仍跑(docs/specs/2026-07-19-product-image-trim-plan.md §4)
    continue-on-error: true # 掃描失敗不影響主同步(獨立 job)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false # 同步腳本不需 design-reference submodule

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run product image trim scan (incremental)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: pnpm exec tsx scripts/image-trim-scan.ts --confirm-write --limit=800

  # ==========================================================================
  # 同步失敗 ⇒ 寄一封到客服信箱(2026-09-12 Sean 拍甲 Q3)
  #
  # 🔴 **為什麼要有它**:本檔 `:43` 逐字寫著「失敗走 GitHub Actions 預設 email(寄給上次改本檔者)」
  #    —— 實查 09-10 那次失敗的 run,`actor` 與 `triggering_actor` 都是 `pcmmotorsports`(Sean 的帳號)
  #    ⇒ 預設信**確實會寄給他**。🛑 **而「會寄」不等於「他會看到」**:那取決於他 GitHub 帳號的
  #    通知設定與信箱過濾,那兩樣在他的帳號裡、我們這一端量不到。
  #    ⇒ 本 job 的價值就是**不依賴任何人的 GitHub 個人設定**,收件人由 secret 決定、改得動。
  #
  # 🔴 **一次排程最多一封**:`needs: sync` 收斂整個 matrix(19 家)⇒ 不是每家一封。
  # 🔴 **它自己失敗會紅,而那是刻意的**:secret 沒設 / Resend 掛掉 ⇒ 這個 job 紅。
  #    一道**安靜失敗的告警**比沒有告警更糟 —— 它會讓人以為「沒收到信 = 沒事」。
  #    代價:Actions 頁會多一顆紅,而它與同步失敗那顆**job 名不同**、分得出來。
  # 🛑 **不吃 `image-trim-scan`**:那支自己帶 `continue-on-error: true`(它失敗不影響主同步)
  #    ⇒ 只 `needs: sync`,否則會為了掃圖失敗吵人。
  # 🔵 取消(cancelled)不寄:`failure()` 只在**有 job 失敗**時為真,cancel 走 `cancelled()`。
  # ==========================================================================
  notify-failure:
    needs: sync
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # 🔴 job 層的 permissions 會【整組取代】workflow 層的那一份,不是疊加
    #    ⇒ 這裡要把需要的都寫出來。本 job 不 checkout ⇒ 不需要 contents。
    #    `actions: read` 是為了讀**本次 run 自己的** job 清單與 log(下面兩發 gh api)。
    permissions:
      actions: read
    steps:
      - name: 收集失敗的供應商並寄出告警信
        env:
          GH_TOKEN: ${{ github.token }}
          # 🔴 寄信管道沿用站台既有那一套(`apps/storefront/src/lib/payment/composition.ts:296-298`
          #    的 EmailAlertNotifierAdapter 用的就是這三個),**不新引入任何服務、不裝套件**。
          #    收件人刻意換一個新名字:`ALERT_EMAIL_TO` 是 Sean 自己,這封要進客服信箱。
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          SYNC_ALERT_TO: ${{ secrets.SYNC_ALERT_TO }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TRIGGER: ${{ github.event_name }}
        run: |
          set -euo pipefail

          # ── ① secret 缺就明確紅,不靜默跳過 ────────────────────────────────
          #    🔴 這一段不可以改成 `if [ -z ... ]; then exit 0; fi` —— 那會讓「沒設收件人」
          #       長得跟「沒有失敗」一模一樣。
          missing=""
          for v in RESEND_API_KEY ALERT_EMAIL_FROM SYNC_ALERT_TO; do
            [ -n "${!v:-}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "🔴 這些 secret 沒有設:$missing" >&2
            echo "   ⇒ 同步失敗的告警信【寄不出去】。去 repo Settings → Secrets 補上(只補名稱對應的值)。" >&2
            exit 1
          fi

          # ── ② 哪幾家失敗、卡在哪一步 ──────────────────────────────────────
          #    🔵 用 job 清單而不是去 parse log:matrix 每一家是**獨立 job**,
          #       清單裡就有 name 與每個 step 的 conclusion ⇒ 一發 API 拿得到「誰 + 哪一步」。
          jobs_json=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100")
          failed=$(printf '%s' "$jobs_json" | jq -r '
            .jobs[]
            | select(.conclusion == "failure")
            | "· \(.name) —— 失敗步驟:\([.steps[]? | select(.conclusion == "failure") | .name] | join(" / "))"')
          if [ -z "$failed" ]; then
            # 走到這裡表示 failure() 為真、而 job 清單裡沒有 failure ⇒ 值得知道,不要吞掉。
            failed="· (讀不到失敗的 job 名稱 —— 去 run 連結自己看)"
          fi
          first_id=$(printf '%s' "$jobs_json" | jq -r '[.jobs[] | select(.conclusion == "failure")][0].id // empty')

          # ── ③ 失敗訊息 ────────────────────────────────────────────────────
          #    ⚠️ 取的是**該 job log 的最後 40 個非空行**(錯誤訊息落在尾巴,不是開頭)。
          #    🔵 GitHub 會把註冊過的 secret 在 log 裡遮成 `***` ⇒ 轉寄 log 不會把金鑰帶出去;
          #       而**沒註冊成 secret 的東西不會被遮** ⇒ 這封信要當成「看得到 log 的人才該收」。
          tail_log="(沒有可讀的 log)"
          if [ -n "$first_id" ]; then
            if gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/${first_id}/logs" > /tmp/job.log 2>/dev/null; then
              tail_log=$(grep -v '^[[:space:]]*$' /tmp/job.log | tail -40 || true)
              [ -n "$tail_log" ] || tail_log="(log 是空的)"
            fi
          fi

          # ── ④ 寄出 ────────────────────────────────────────────────────────
          #    🔵 收件人容許逗號分隔多個;Resend 收陣列,單一位址包成一元陣列也合法。
          body=$(printf '%s\n' \
            "供應商每日同步失敗了。" \
            "" \
            "觸發方式:${TRIGGER}" \
            "Run 連結:${RUN_URL}" \
            "" \
            "失敗的:" \
            "${failed}" \
            "" \
            "第一個失敗 job 的 log(最後 40 行):" \
            "----------------------------------------" \
            "${tail_log}")
          jq -n \
            --arg from "$ALERT_EMAIL_FROM" \
            --arg to "$SYNC_ALERT_TO" \
            --arg subject "[PCM] 供應商每日同步失敗($(date -u '+%Y-%m-%d %H:%M') UTC)" \
            --arg text "$body" \
            '{from: $from, to: ($to | split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0))), subject: $subject, text: $text}' \
            > /tmp/payload.json

          #    🔴 `-o` 把回應寫檔、只把 http_code 印出來:回應內容不直接進 log
          #       (它不含 API key,而少印一點總比多印好);Authorization 一律不 echo。
          code=$(curl -sS -X POST 'https://api.resend.com/emails' \
            -H "Authorization: Bearer ${RESEND_API_KEY}" \
            -H 'Content-Type: application/json' \
            --data @/tmp/payload.json \
            -o /tmp/resend.json -w '%{http_code}')
          echo "Resend 回應碼:${code}"
          case "$code" in
            2*) echo "✅ 告警信已送出(收件人由 SYNC_ALERT_TO 決定,值不印)";;
            *)  echo "🔴 Resend 沒有收下這封信(HTTP ${code})⇒ 告警沒送到。" >&2
                jq -r '.message // .name // "(回應沒有 message 欄位)"' /tmp/resend.json >&2 || true
                exit 1;;
          esac
